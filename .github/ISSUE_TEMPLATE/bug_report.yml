name: Bug report
description: Report reproducible incorrect behavior in RunAcross
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RunAcross version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and Boto3 versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, tokens, account emails, and sensitive data.
    validations:
      required: true

