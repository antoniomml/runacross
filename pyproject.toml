[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runacross"
version = "0.1.2"
description = "Concurrent Python execution across AWS accounts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Antonio Milla" },
]
keywords = [
    "aws",
    "boto3",
    "multi-account",
    "organizations",
    "sts",
]
dependencies = [
    "boto3>=1.40.40",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/antoniomml/runacross"
Repository = "https://github.com/antoniomml/runacross"
Issues = "https://github.com/antoniomml/runacross/issues"
Changelog = "https://github.com/antoniomml/runacross/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.17",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.12",
    "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runacross"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

